name = "60s"
main = "cf-worker.ts"
compatibility_date = "2025-11-05"
compatibility_flags = [ "nodejs_compat" ]

[observability.logs]
enabled = true

# ── 博客资讯页重建巡检 ──────────────────────────────────────────
# 上游 vikiboss/60s-static-host 通常在北京 05:31~05:39 发布当天数据，但并非
# 保证 —— 2026-11-04 上游整天没发，页面就一直停在 11-03。所以巡检改成
# **全天覆盖**，不再只守早上那几个小时。
#
# 每 30 分钟一次，一天 48 次。绝大多数会在「上游没发 / 页面已最新」这两步
# 直接返回，成本接近于零；只有真需要重建时才发 dispatch（每天最多 3 次）。
#
# 只配 1 条表达式：Workers 免费版每账号只允许 5 个 Cron Trigger，
# 拆成十几条会直接超限。
#
# 分钟取 10/40 而非 0/30：避开整点，错开上游与 GitHub 的自身调度高峰。
[triggers]
crons = [ "10,40 * * * *" ]
