name = "60s"
main = "cf-worker.ts"
compatibility_date = "2025-11-05"
compatibility_flags = [ "nodejs_compat" ]

[observability.logs]
enabled = true

# ── 博客资讯页重建巡检 ──────────────────────────────────────────
# 上游 vikiboss/60s-static-host 在北京时间 05:31~05:39 发布当天数据。
# 从这里开始每 30 分钟巡检一次：数据已就绪、而 cayzlh.com/news/ 还挂着
# 昨天期号时，就 dispatch 一次博客重建。
#
# 为什么需要：博客自己的 schedule 是 UTC 23:30（北京 07:30），理论上够用，
# 但 GitHub Actions 的 schedule 实测经常晚 1~3 小时（122 次采样：中位
# +126 分钟，84% 超过 1 小时）。这段时间页面上是前一天的资讯。
#
# 只配 1 条表达式：Workers 免费版每账号只允许 5 个 Cron Trigger，
# 拆成十几条会直接超限。用一条跨 UTC 日界的表达式覆盖北京 05:05–12:35。
#
# cron 按 UTC 写。UTC 21:40 = 北京次日 05:40，UTC 04:40 = 北京 12:40。
# 分钟取 10/40：发刊最晚 05:39，05:40 那一次正好在之后就绪；05:10 那次会
# 因为上游还没发而直接返回，几乎零成本。
#
# 只在「数据已有 + 页面还旧」时才真的触发；页面更新后自动静默。
# 模块内部另有 15 分钟最小间隔与每日 3 次上限，防止重复 dispatch。
[triggers]
crons = [ "10,40 21-4 * * *" ]
